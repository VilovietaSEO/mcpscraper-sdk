    observation:
      symptom: A generated typed credits_info call failed before reading its successful MCP result.
      expected: The typed Node MCP client should accept the hosted endpoint response and return structuredContent.
      actual: 'The client called response.json() on a text/event-stream body beginning with event: message and threw SyntaxError.'
